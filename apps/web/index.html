<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shaurya Yadav — Senior React Native Developer</title>
    <meta
      name="description"
      content="Senior React Native Developer with 5.8+ years building production-grade cross-platform apps for Android & iOS. TypeScript, Redux, Firebase — now exploring AI engineering."
    />
    <meta name="theme-color" content="#07070b" />
    <script>
      // Resolve theme before first paint (prevents flash): stored choice → system preference → dark default.
      (function () {
        try {
          var stored = localStorage.getItem("portfolio-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute(
              "content",
              theme === "light" ? "#f4f3ec" : "#07070b"
            );
          }
        } catch (error) {
          /* storage blocked — keep the dark default */
        }
      })();
    </script>
    <meta property="og:title" content="Shaurya Yadav — Senior React Native Developer" />
    <meta
      property="og:description"
      content="5.8+ years crafting production-grade cross-platform mobile experiences. Now building with AI."
    />
